<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Вход</title>
    </head>
    <body>
        <h2>Вход</h2>
        <form th:action="@{/login}" method="post">
            <div>
                <label>Имя пользователя:</label>
                <input type="text" name="username" />
            </div>
            <div>
                <label>Пароль:</label>
                <input type="password" name="password" />
            </div>
            <div th:if="${param.error}" style="color:red">Неверное имя пользователя или пароль</div>
            <div th:if="${param.registered}" style="color:green">Регистрация прошла успешно. Войдите.</div>
            <button type="submit">Войти</button>
        </form>
        <a href="/register">Нет аккаунта? Зарегистрируйтесь</a>
    </body>
</html>
