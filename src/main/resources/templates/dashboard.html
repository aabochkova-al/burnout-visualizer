<html>
    <head>
      <meta charset="UTF-8">
      <title>Дашборд - Мой уровень выгорания</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" th:href="@{/styles.css}">
    </head>
    <body>
    <div class="container">
        <div class="app-header">
            <h1>Мой уровень выгорания</h1>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-logout">Выйти</button>
            </form>
        </div>

        <!-- Форма генерации -->
        <div class="panel">
            <div class="panel-title">Создать индикатор выгорания</div>
            <div class="panel-sub">Параметры вашего текущего состояния</div>

            <form th:action="@{/generate}" th:object="${requestDto}" method="post">
                <div class="form-row">
                    <div class="form-col">
                        <div class="field-group">
                            <label>Уровень усталости (1-10)</label>
                            <input type="number" th:field="*{fatigueLevel}" min="1" max="10"/>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="field-group">
                            <label>Длительность (дней)</label>
                            <input type="number" th:field="*{stressDuration}" min="1"/>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="field-group">
                            <label>Кофе в день</label>
                            <input type="number" th:field="*{coffeeAmount}" min="0"/>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="field-group">
                            <label>Стиль визуализации</label>
                            <select th:field="*{visualStyle}">
                                <option value="ABSTRACT">Абстрактный</option>
                                <option value="COMIC">Комикс</option>
                                <option value="MINIMALISTIC">Минималистичный</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div th:if="${error}" class="alert-error" th:text="${error}"></div>
                <div th:if="${param.success}" class="alert-success">Запрос принят, генерация началась. Статус можно отслеживать в истории.</div>

                <div class="generate-btn-container">
                    <button type="submit" class="btn btn-primary" style="font-size: 1.2rem; padding: 16px 40px;">
                        Сгенерировать образ
                    </button>
                </div>
            </form>
        </div>

        <!-- История запросов -->
        <div class="panel">
               <div class="panel-title">История запросов</div>
               <div class="grid-cards">
                   <div th:each="req : ${history}" class="card-item">
                       <p><strong>Усталость:</strong> <span th:text="${req.fatigueLevel}"/> / 10</p>
                       <p><strong>Период:</strong> <span th:text="${req.stressDuration}"/> дней</p>
                       <p><strong>Кофе:</strong> <span th:text="${req.coffeeAmount}"/> чашек</p>
                       <p><strong>Статус:</strong> 
                           <span th:text="${req.status}" th:class="'status ' + ${req.status}"></span>
                       </p>

                       <div th:if="${req.image != null}">
                           <a th:href="${req.image.fileUrl}" target="_blank" rel="noopener">
                               <img th:src="${req.image.fileUrl}" alt="Результат" style="max-height: 220px;">
                           </a>
                           <form th:action="@{/favorite/{id}(id=${req.image.id})}" method="post" style="display:inline; margin-left: 8px;">
                               <button type="submit" class="favorite-star" 
                                       th:classappend="${req.image.isFavorite} ? 'active' : ''">★</button>
                           </form>
                       </div>
                       <!-- Кнопка повторить -->
                       <form th:action="@{/generate}" method="post" style="margin-top: 12px;">
                           <input type="hidden" name="fatigueLevel" th:value="${req.fatigueLevel}"/>
                           <input type="hidden" name="stressDuration" th:value="${req.stressDuration}"/>
                           <input type="hidden" name="coffeeAmount" th:value="${req.coffeeAmount}"/>
                           <input type="hidden" name="visualStyle" th:value="${req.visualStyle}"/>
                           <button type="submit" class="btn btn-secondary">Повторить запрос</button>
                       </form>
                   </div>
               </div>
           </div>

        <!-- Избранное -->
        <div class="panel">
            <div class="panel-title">⭐ Избранное</div>
            <div class="grid-cards">
                <div th:each="img : ${favorites}" class="card-item">
                    <img th:src="${img.fileUrl}" alt="Избранное">
                    <p><strong>Файл:</strong> <span th:text="${img.fileName}"/></p>
                    <form th:action="@{/favorite/{id}(id=${img.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Убрать из избранного</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        function hasPendingStatus() {
            var statusElements = document.querySelectorAll('.status');
            for (var i = 0; i < statusElements.length; i++) {
                if (statusElements[i].textContent.trim() === 'PENDING') {
                    return true;
                }
            }
            return false;
        }
        if (hasPendingStatus()) {
            setTimeout(function() {
                location.reload();
            }, 5000); // 5 секунд
        }
    </script>
        
    </body>
</html>
