<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="historyList">
            <div class="panel-title">История запросов</div>
            
            <div class="grid-cards">
                <div th:each="req : ${history}" class="card-item">
                    <p><strong>Усталость:</strong> <span th:text="${req.fatigueLevel}"/> / 10</p>
                    <p><strong>Период:</strong> <span th:text="${req.stressDuration}"/> дней</p>
                    <p><strong>Кофе:</strong> <span th:text="${req.coffeeAmount}"/> чашек</p>
                    <p><strong>Стиль:</strong> <span th:text="${req.visualStyle}"/></p>
                    <p><strong>Статус:</strong> 
                        <span th:text="${req.status}" 
                              th:class="'status ' + ${req.status}"></span>
                    </p>

                    <div th:if="${req.image != null}">
                        <a th:href="${req.image.fileUrl}" target="_blank" rel="noopener">
                            <img th:src="${req.image.fileUrl}" 
                                 alt="Результат" 
                                 style="max-height: 220px; width: 100%; object-fit: contain;">
                        </a>
                        
                        <form th:action="@{/favorite/{id}(id=${req.image.id})}" 
                              method="post" 
                              style="display:inline; margin-left: 8px;">
                            <button type="submit" 
                                    class="favorite-star"
                                    th:classappend="${req.image.isFavorite} ? 'active' : ''">
                                ★
                            </button>
                        </form>
                    </div>

                    <div style="margin-top: 15px;">
                        <a th:href="@{/dashboard(
                            fatigueLevel=${req.fatigueLevel},
                            stressDuration=${req.stressDuration},
                            coffeeAmount=${req.coffeeAmount},
                            visualStyle=${req.visualStyle})}" 
                           class="btn btn-secondary">
                            Повторить
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(history)}" 
                 style="color:#6c757d; padding: 2rem; text-align: center; font-size: 1.1rem;">
                История запросов пуста.<br>
                Создайте первый индикатор выгорания!
            </div>
        </div>
    </body>
</html>
